<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infinite Login</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b12;color:#fff;font-family:Inter,Arial}.box{width:min(420px,90%);background:#101621;padding:28px;border-radius:18px;border:1px solid #26364e}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #2b3b55;background:#0b111b;color:#fff}button{background:#1683ff;border:0}.muted{color:#8fa1ba}</style></head>
<body><div class="box"><h1>∞ Infinite</h1><p class="muted">Sign in to your active subscription.</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="m"></p></div>
<script>async function login(){m.textContent="";let r=await fetch("/api/infinite/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});let d=await r.json();if(r.ok){location.href="/";}else m.textContent=d.error||"Login failed";}</script></body></html>
